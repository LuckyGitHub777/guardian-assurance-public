[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "guardian-assurance"
version = "1.0.0"
description = "Local-first, read-only publication assurance infrastructure."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
keywords = ["assurance", "publication", "provenance", "security", "verification"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
guardian-pa = "guardian_assurance.cli:main"

[tool.setuptools.packages.find]
include = ["guardian_assurance*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
