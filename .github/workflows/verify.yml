name: Guardian Verification

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: guardian-verification-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: python -m pip install --quiet '.[dev]'

      - name: Test
        run: python -m pytest -q

      - name: Guardian self-verification
        run: guardian-pa verify . --receipt "$RUNNER_TEMP/guardian-receipt.json"

      - name: Privacy assertions
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "guardian-receipt.json"
          receipt = json.loads(p.read_text())
          assert receipt["result"] == "VERIFIED"
          rendered = p.read_text().lower()
          for forbidden in (("/" + "home/runner"), ("c:" + "\\\\users\\\\"), "hostname", "username"):
              assert forbidden not in rendered
          print("receipt privacy checks: PASS")
          PY

      - name: Upload exact-revision receipt
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guardian-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/guardian-receipt.json
          if-no-files-found: error
          retention-days: 30
